name: Vocabulary

# The vocabulary spec gates ddot.it parsing so that indexing it yields exactly the
# built-in triples -- no prose, no link: macros, no examples. This job indexes the
# spec and asserts that it still yields the checked-in
# site/spec/ddot-it-vocabulary.ddot.

on:
  push:
    branches: [main]
    paths:
      - 'site/spec/ddot-it-vocabulary.adoc'
      - 'site/spec/ddot-it-vocabulary.ddot'
      - 'check-vocabulary.sh'
      - '.github/workflows/vocabulary.yml'
  pull_request:
    paths:
      - 'site/spec/ddot-it-vocabulary.adoc'
      - 'site/spec/ddot-it-vocabulary.ddot'
      - 'check-vocabulary.sh'
      - '.github/workflows/vocabulary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (hash-pinned for security)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Indexing uses @calpano/ddot-parser, whose token and event streams are
      # asserted against the same cross-implementation corpus as the TextMate
      # grammar. No sibling checkout and no access to any other repository —
      # the previous ddot.it-java checkout needed a cross-repo token for a
      # private repo, which the default GITHUB_TOKEN cannot provide.
      # BOOTSTRAP, remove once @calpano/ddot-parser 0.1.0 is on npm.
      # npm's trusted publishing is configured per package and can only be set
      # on a package that already exists, so CI cannot publish a package's very
      # first version -- that one needs a manual `npm publish`. Until it lands,
      # `npx @calpano/ddot-parser` 404s. Run the same code from its public
      # source repo instead, pinned to the tag that carries it. Deleting this
      # step and the DDOT_INDEX below restores the npx path.
      - name: Checkout ddot.it-syntax-tools (parser not yet on npm)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Calpano/ddot.it-syntax-tools
          ref: v0.1.2
          path: syntax-tools

      - name: Assert the spec yields exactly the built-in triples
        run: ./check-vocabulary.sh
        env:
          DDOT_INDEX: node ${{ github.workspace }}/syntax-tools/parser/bin/ddot-index.js

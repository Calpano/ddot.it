name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (hash-pinned for security)
      - uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0 (hash-pinned for security)
        with:
          ruby-version: '3.3'
          bundler-cache: true
      # asciidoctor-diagram renders the `[plantuml]` class diagrams in
      # site/spec/*.adoc; PlantUML needs Graphviz `dot` for class-diagram
      # layout (Java is preinstalled on the runner).
      - name: Install Graphviz for PlantUML diagrams
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0 (hash-pinned for security)
      - run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      # Broken cross-references do not fail the Jekyll build, and AsciiDoc has no
      # source-level validation for them at all — an unresolved <<ref>> renders as
      # an ordinary-looking link. Check the built output instead.
      - name: Check internal links
        run: python3 tools/check-site-links.py _site
      # Rouge emits `<span class="err">` for input it could not lex. That is the
      # only signal it gives, and it covers two distinct faults: a malformed code
      # sample, or a genuine lexer bug on valid input — the latter is how the
      # rouge-ddot 0.1.2 blank-line-in-`?end=`-block defect surfaced. Since the
      # ddot.it blocks are lexed by a gem released from another repository, this
      # also catches a bad lexer upgrade reaching the site.
      - name: Check for unlexable code (Rouge error spans)
        run: |
          matches=$(grep -rn '<span class="err">' _site --include='*.html' || true)
          if [ -n "$matches" ]; then
            echo "::error::Rouge could not lex some code; each line below holds an unlexable span"
            printf '%s\n' "$matches" | cut -c1-240
            exit 1
          fi
          echo "no Rouge error spans"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0 (hash-pinned for security)

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0 (hash-pinned for security)

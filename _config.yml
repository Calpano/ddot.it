source: site

sass:
  quiet_deps: true
  silence_deprecations:
    - color-functions
    - import

title: ddot.it
description: "Connect anything with everything. A minimal plain-text syntax for building a knowledge graph across any tool or document."
theme: just-the-docs

url: https://ddot.it

favicon_ico: "/assets/images/favicon.svg"
logo: "/images/icon-128.png"


nav_external_links:
  - title: GitHub
    url: https://github.com/Calpano/ddot.it
    opens_in_new_tab: true

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

plugins:
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-relative-links
  - jekyll-asciidoc

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "README.md"
    values:
      nav_exclude: true

# AsciiDoc rendering (site/spec/*.adoc).
# `idprefix`/`idseparator` are deliberately left at their defaults: the specs
# cross-reference sections by title, and changing the generated id scheme would
# silently break those links.
asciidoctor:
  base_dir: :docdir
  safe: unsafe
  attributes:
    - source-highlighter=rouge
    - icons=font
    - toc=macro
    - sectanchors
